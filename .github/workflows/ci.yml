---
name: CI

on:
  push:
  pull_request:

jobs:
  test-ubuntu:
    name: Run playbook (Ubuntu 26.04)
    runs-on: ubuntu-26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for snapd to be ready
        run: sudo snap wait system seed.loaded

      - name: Install Ansible and prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ansible-core \
            python3-pip \
            python3-testinfra \
            git \
            curl \
            ca-certificates

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check
        run: ansible-playbook playbook.yaml --syntax-check

      - name: Run playbook
        run: ansible-playbook playbook.yaml -i localhost, -c local

      - name: Verify installed packages
        run: pytest --hosts='local://' tests/test_packages.py

      - name: Re-run playbook (idempotency check)
        run: ansible-playbook playbook.yaml -i localhost, -c local
