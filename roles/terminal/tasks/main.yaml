- name: Install Ghostty
  ansible.builtin.package:
    name: ghostty
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install zoxide
  ansible.builtin.package:
    name: zoxide
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install difftastic
  ansible.builtin.package:
    name: difftastic
    state: present
  when: ansible_facts['os_family'] == "Darwin"
