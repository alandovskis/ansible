- name: Install modern curl alternative
  ansible.builtin.package:
    name: curlie
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install DNS lookup tool
  ansible.builtin.package:
    name: doggo
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install HTTP client
  ansible.builtin.package:
    name: httpie
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install network testing tool
  ansible.builtin.package:
    name: iperf3
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install network interface tool (macOS)
  ansible.builtin.package:
    name: iproute2mac
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install network interface tool (Debian/Ubuntu)
  ansible.builtin.package:
    name: iproute2
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install network security scanner
  ansible.builtin.package:
    name: masscan
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install network diagnostic tool
  ansible.builtin.package:
    name: mtr
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install network monitoring tool
  ansible.builtin.package:
    name: nethogs
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install network scanner
  ansible.builtin.package:
    name: nmap
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install SSH client (macOS)
  ansible.builtin.package:
    name: openssh
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install SSH client (Debian/Ubuntu)
  ansible.builtin.package:
    name: openssh-client
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install tcpdump alternative
  ansible.builtin.package:
    name: tcpflow
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install wireless network scanner
  ansible.builtin.package:
    name: wifi-password
    state: present
  when: ansible_facts['os_family'] == "Darwin"
