  when: ansible_facts['os_family'] == "Darwin"

- name: Install surge
  ansible.builtin.package:
    name: surge
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Configure direnv for zsh
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    regexp: '^eval "\\\\$(direnv hook zsh)"'
    line: 'eval "$(direnv hook zsh)"'
    insertafter: EOF
    create: true

- name: Install gnu-tar
  ansible.builtin.package:
    name: gnu-tar
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install git
  ansible.builtin.package:
    name: git
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install delta
  ansible.builtin.package:
    name: git-delta
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install GNU Stow
  ansible.builtin.package:
    name: stow
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"
