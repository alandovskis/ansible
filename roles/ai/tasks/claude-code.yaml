- name: Check for existing Claude Code install
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  register: claude_code_binary

- name: Ensure Downloads directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Downloads"
    state: directory
    mode: "0755"
  when: not claude_code_binary.stat.exists

- name: Download Claude Code installer
  ansible.builtin.get_url:
    url: https://downloads.claude.ai/claude-code-releases/bootstrap.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/Downloads/claude-code-install.sh"
    mode: "0755"
    checksum: sha256:3a68d3406cf674e17bed1733a4dcf37805e2e47d87417700007d7e1aa766a944
  when: not claude_code_binary.stat.exists

- name: Run Claude Code installer
  ansible.builtin.command:
    cmd: "{{ ansible_facts['env']['HOME'] }}/Downloads/claude-code-install.sh stable"
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"

- name: Expose claude on PATH for non-login shells (Debian/Ubuntu)
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
    dest: /usr/local/bin/claude
    state: link
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Check for existing ccstatusline install
  ansible.builtin.shell:
    cmd: command -v ccstatusline
  register: ccstatusline_check
  changed_when: false
  failed_when: false

- name: Install ccstatusline
  community.general.npm:
    name: ccstatusline
    global: true
    state: present
  when: ccstatusline_check.rc != 0

- name: Check for existing Claude settings
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
  register: claude_settings_file

- name: Load existing Claude settings
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
  register: claude_settings_raw
  when: claude_settings_file.stat.exists

- name: Ensure Claude config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude"
    state: directory
    mode: "0755"

- name: Configure ccstatusline as the Claude Code status line
  ansible.builtin.copy:
    content: >-
      {{
        (claude_settings_raw.content | b64decode | from_json
          if claude_settings_file.stat.exists
          else {})
        | combine({'statusLine': {'type': 'command', 'command': 'ccstatusline'}}, recursive=True)
        | to_nice_json
      }}
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
    mode: "0644"

- name: Register Claude Code's official plugin marketplace
  ansible.builtin.command:
    cmd: claude plugin marketplace add anthropics/claude-plugins-official
  register: claude_marketplace_add
  changed_when: "'already on disk' not in claude_marketplace_add.stdout"

- name: Update Claude Code's official plugin marketplace cache
  ansible.builtin.command:
    cmd: claude plugin marketplace update claude-plugins-official
  changed_when: false

- name: Install Superpowers plugin for Claude Code
  ansible.builtin.command:
    cmd: claude plugin install superpowers@claude-plugins-official --scope user --yes --json
  register: claude_superpowers_install
  changed_when: "'already installed' not in (claude_superpowers_install.stdout | from_json).message"

- name: Enable Superpowers plugin for Claude Code
  ansible.builtin.command:
    cmd: claude plugin enable superpowers@claude-plugins-official --scope user --json
  register: claude_superpowers_enable
  changed_when: (claude_superpowers_enable.stdout | from_json).outcome == "ok"
  failed_when: >-
    (claude_superpowers_enable.stdout | from_json).outcome != "ok" and
    (claude_superpowers_enable.stdout | from_json).failureCode != "already_in_goal_state"
