- name: Install Node.js (macOS)
  ansible.builtin.package:
    name: node
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install Node.js (Debian/Ubuntu)
  ansible.builtin.package:
    name:
      - nodejs
      - npm
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"
