- name: Install GCC
  ansible.builtin.package:
    name: gcc
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install GDB
  ansible.builtin.package:
    name: gdb
    state: present
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Install Valgrind (Debian/Ubuntu only, unsupported on macOS/Apple Silicon)
  ansible.builtin.package:
    name: valgrind
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install GNU Make (macOS)
  ansible.builtin.package:
    name: make
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install GNU Make (Debian/Ubuntu)
  ansible.builtin.package:
    name: make
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install Clang (macOS)
  ansible.builtin.package:
    name: llvm
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install Clang (Debian/Ubuntu)
  ansible.builtin.package:
    name: clang
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Get Homebrew prefix (macOS)
  ansible.builtin.command:
    cmd: brew --prefix
  register: brew_prefix
  changed_when: false
  when: ansible_facts['os_family'] == "Darwin"

- name: Expose GNU Make as `make` (Homebrew installs it as gmake to avoid clobbering the system make)
  ansible.builtin.file:
    src: "{{ brew_prefix.stdout }}/opt/make/libexec/gnubin/make"
    dest: "{{ brew_prefix.stdout }}/bin/make"
    state: link
  when: ansible_facts['os_family'] == "Darwin"

- name: Expose clang (macOS keeps llvm keg-only to avoid conflicting with the system clang)
  ansible.builtin.file:
    src: "{{ brew_prefix.stdout }}/opt/llvm/bin/clang"
    dest: "{{ brew_prefix.stdout }}/bin/clang"
    state: link
  when: ansible_facts['os_family'] == "Darwin"

- name: Expose clang++ (macOS keeps llvm keg-only to avoid conflicting with the system clang++)
  ansible.builtin.file:
    src: "{{ brew_prefix.stdout }}/opt/llvm/bin/clang++"
    dest: "{{ brew_prefix.stdout }}/bin/clang++"
    state: link
  when: ansible_facts['os_family'] == "Darwin"

- name: Install CLion (macOS)
  ansible.builtin.package:
    name: clion
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install CLion (Debian/Ubuntu)
  community.general.snap:
    name: clion
    classic: true
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"
